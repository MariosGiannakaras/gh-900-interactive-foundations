name: GH-900 Unit Course Engine

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - "lab/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: gh900-course-${{ github.repository }}
  cancel-in-progress: false

jobs:
  progress:
    if: github.repository != 'MariosGiannakaras/gh-900-interactive-foundations'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate current unit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_TITLE: "GH-900 Interactive Foundations — Course"
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          row=$(gh issue list --state all --limit 100 --json number,title,state \
            | jq -r --arg title "$COURSE_TITLE" '.[] | select(.title == $title) | [.number,.state] | @tsv' \
            | head -n 1)
          if [[ -z "$row" ]]; then
            echo "Course Issue does not exist yet; Step 0 will create it."
            exit 0
          fi
          issue_number=$(printf '%s' "$row" | cut -f1)
          issue_state=$(printf '%s' "$row" | cut -f2)
          [[ "$issue_state" == "OPEN" ]] || exit 0

          body=$(gh issue view "$issue_number" --json body --jq .body)
          state=$(grep -oE 'gh900-state:m[0-9]{2}-u[0-9]{2}' <<<"$body" | head -n1 | cut -d: -f2)
          if [[ -z "$state" ]]; then
            echo "Course state marker is missing."
            exit 1
          fi

          meta=$(python3 scripts/course_unit_state.py --unit "$state")
          mode=$(jq -r .mode <<<"$meta")
          module=$(jq -r .module <<<"$meta")
          branch=$(jq -r .branch <<<"$meta")
          advance=false

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            [[ "${COMMENT_ISSUE:-}" == "$issue_number" ]] || exit 0
            command=$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r' | xargs)
            if [[ "$command" == "/help" ]]; then
              python3 scripts/course_unit_state.py --unit "$state" --render > /tmp/current.md
              gh issue comment "$issue_number" --body-file /tmp/current.md
              exit 0
            fi
            if [[ "$mode" == "read" || "$mode" == "summary" ]]; then
              if [[ "$command" == "/next" ]]; then
                advance=true
              else
                gh issue comment "$issue_number" --body $'This unit is a reading/understanding step. Comment exactly `/next` when you are ready, or `/help` to show the unit again.'
                exit 0
              fi
            else
              gh issue comment "$issue_number" --body $'This checkpoint advances from repository state, not a comment. Complete the latest hands-on/assessment instruction and push the required branch.'
              exit 0
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" == "$branch" ]] || exit 0
            if [[ "$mode" == "activity" ]]; then
              set +e
              output=$(python3 scripts/validate_unit_activity.py --module "$module" 2>&1)
              result=$?
              set -e
              if (( result != 0 )); then
                {
                  printf '### Hands-on checkpoint needs another attempt\n\n```text\n%s\n```\n\n' "$output"
                  printf '%s\n' 'Fix the listed items and push again. The course remains on the current official unit.'
                } > /tmp/fail.md
                gh issue comment "$issue_number" --body-file /tmp/fail.md
                exit "$result"
              fi
              advance=true
            elif [[ "$mode" == "assessment" ]]; then
              if (( module == 1 )); then
                validator=(python3 scripts/validate_module_01.py)
              else
                validator=(python3 scripts/validate_course_module.py --module "$module")
              fi
              set +e
              output=$("${validator[@]}" 2>&1)
              result=$?
              set -e
              if (( result != 0 )); then
                {
                  printf '### Blind assessment needs another attempt\n\n```text\n%s\n```\n\n' "$output"
                  printf '%s\n' 'Review only the indicated questions, change your selections, and push again. Correct answers remain hidden.'
                } > /tmp/fail.md
                gh issue comment "$issue_number" --body-file /tmp/fail.md
                exit "$result"
              fi
              advance=true
            else
              exit 0
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/course_unit_state.py --unit "$state" --render > /tmp/current.md
            gh issue comment "$issue_number" --body-file /tmp/current.md
            exit 0
          fi

          [[ "$advance" == "true" ]] || exit 0

          set +e
          next_meta=$(python3 scripts/course_unit_state.py --unit "$state" --next 2>/dev/null)
          next_result=$?
          set -e
          if (( next_result == 3 )); then
            gh issue comment "$issue_number" --body $'## Course complete\n\nYou completed the full official Microsoft Learn GitHub Foundations sequence represented by this course. The repository has recorded all 106 unit checkpoints. Continue with the official GH-900 Practice Assessment and exam-style mocks for final readiness.'
            new_body=$(printf '%s' "$body" | sed -E "s/<!-- gh900-state:[^>]+ -->/<!-- gh900-state:complete -->/")
            gh issue edit "$issue_number" --body "$new_body"
            gh issue close "$issue_number" --reason completed
            exit 0
          fi

          next_state=$(jq -r .id <<<"$next_meta")
          new_body=$(printf '%s' "$body" | sed -E "s/<!-- gh900-state:[^>]+ -->/<!-- gh900-state:${next_state} -->/")
          gh issue edit "$issue_number" --body "$new_body"
          python3 scripts/course_unit_state.py --unit "$next_state" --render > /tmp/next.md
          gh issue comment "$issue_number" --body-file /tmp/next.md
