name: GH-900 Unit Course Engine

on:
  issue_comment:
    types: [created]
  push:
    branches:
      - "lab/**"
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: gh900-course-${{ github.repository }}
  cancel-in-progress: false

jobs:
  progress:
    # Never run learner state in a repository that is itself marked as a template.
    # For pull requests, also reject drive-by PRs before checkout so untrusted fork
    # code is not executed.
    if: >-
      !github.event.repository.is_template &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate current unit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_TITLE: "GH-900 Interactive Foundations — Course"
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
          COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Comments written by this workflow are GitHub bot comments and must never
          # recursively drive the state machine. Public drive-by commenters are also
          # not allowed to progress somebody else's learning repository.
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "${COMMENT_AUTHOR_TYPE:-}" == "Bot" ]]; then
              echo "Ignoring bot-generated comment."
              exit 0
            fi
            case "${COMMENT_ASSOCIATION:-}" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                echo "Ignoring course command from non-owner/non-collaborator association: ${COMMENT_ASSOCIATION:-unknown}."
                exit 0
                ;;
            esac
          fi

          row=$(gh issue list --state all --limit 100 --json number,title,state \
            | jq -r --arg title "$COURSE_TITLE" '.[] | select(.title == $title) | [.number,.state] | @tsv' \
            | head -n 1)
          if [[ -z "$row" ]]; then
            echo "Course Issue does not exist yet; Step 0 will create it."
            exit 0
          fi
          issue_number=$(printf '%s' "$row" | cut -f1)
          issue_state=$(printf '%s' "$row" | cut -f2)
          [[ "$issue_state" == "OPEN" ]] || exit 0

          body=$(gh issue view "$issue_number" --json body --jq .body)
          state=$(grep -oE 'gh900-state:m[0-9]{2}-u[0-9]{2}' <<<"$body" | head -n1 | cut -d: -f2)
          if [[ -z "$state" ]]; then
            echo "Course state marker is missing."
            exit 1
          fi

          meta=$(python3 scripts/course_unit_state.py --unit "$state")
          mode=$(jq -r .mode <<<"$meta")
          module=$(jq -r .module <<<"$meta")
          branch=$(jq -r .branch <<<"$meta")
          advance=false

          post_activity_failure() {
            local output="$1"
            {
              printf '### Hands-on checkpoint needs another attempt\n\n```text\n%s\n```\n\n' "$output"
              printf '%s\n' 'Fix the listed items. A relevant push/PR update will check the state again automatically; `/check` is also available as recovery.'
            } > /tmp/fail.md
            gh issue comment "$issue_number" --body-file /tmp/fail.md
          }

          post_assessment_failure() {
            local output="$1"
            {
              printf '### Blind assessment needs another attempt\n\n```text\n%s\n```\n\n' "$output"
              printf '%s\n' 'Review only the indicated questions, change your selections, and push again. Correct answers remain hidden.'
            } > /tmp/fail.md
            gh issue comment "$issue_number" --body-file /tmp/fail.md
          }

          validate_current_checkpoint() {
            if [[ "$mode" == "activity" ]]; then
              set +e
              output=$(python3 scripts/validate_unit_activity.py --module "$module" 2>&1)
              result=$?
              set -e
              if (( result != 0 )); then
                post_activity_failure "$output"
                return "$result"
              fi
              return 0
            fi

            if [[ "$mode" == "assessment" ]]; then
              if (( module == 1 )); then
                validator=(python3 scripts/validate_module_01.py)
              else
                validator=(python3 scripts/validate_course_module.py --module "$module")
              fi
              set +e
              output=$("${validator[@]}" 2>&1)
              result=$?
              set -e
              if (( result != 0 )); then
                post_assessment_failure "$output"
                return "$result"
              fi
              return 0
            fi

            return 3
          }

          checkout_lab_branch_for_recheck() {
            if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              gh issue comment "$issue_number" --body "The current checkpoint expects branch \`$branch\`, but that branch does not exist yet. Create it from \`main\`, complete the activity, and push."
              return 1
            fi
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          }

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            [[ "${COMMENT_ISSUE:-}" == "$issue_number" ]] || exit 0
            command=$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r' | xargs)

            if [[ "$command" == "/help" ]]; then
              python3 scripts/course_unit_state.py --unit "$state" --render > /tmp/current.md
              gh issue comment "$issue_number" --body-file /tmp/current.md
              exit 0
            fi

            if [[ "$mode" == "read" || "$mode" == "summary" ]]; then
              if [[ "$command" == "/next" ]]; then
                advance=true
              else
                gh issue comment "$issue_number" --body $'This unit is a reading/understanding step. Comment exactly `/next` when you are ready, or `/help` to show the unit again.'
                exit 0
              fi
            elif [[ "$command" == "/check" ]]; then
              checkout_lab_branch_for_recheck || exit 0
              if validate_current_checkpoint; then
                advance=true
              else
                exit 0
              fi
            else
              gh issue comment "$issue_number" --body $'This checkpoint advances from repository state. Complete the latest hands-on/assessment instruction; relevant pushes and Pull Request updates are checked automatically. Use `/check` only as a recovery recheck.'
              exit 0
            fi

          elif [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" == "$branch" ]] || exit 0
            if validate_current_checkpoint; then
              advance=true
            else
              exit 1
            fi

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "${PR_HEAD_REF:-}" == "$branch" ]] || exit 0
            [[ "$mode" == "activity" ]] || exit 0
            if validate_current_checkpoint; then
              advance=true
            else
              exit 1
            fi

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/course_unit_state.py --unit "$state" --render > /tmp/current.md
            gh issue comment "$issue_number" --body-file /tmp/current.md
            exit 0
          fi

          [[ "$advance" == "true" ]] || exit 0

          set +e
          next_meta=$(python3 scripts/course_unit_state.py --unit "$state" --next 2>/dev/null)
          next_result=$?
          set -e
          if (( next_result == 3 )); then
            gh issue comment "$issue_number" --body $'## Course complete\n\nYou completed the full official Microsoft Learn GitHub Foundations sequence represented by this course. The repository has recorded all 106 unit checkpoints. Continue with the official GH-900 Practice Assessment and exam-style mocks for final readiness.'
            new_body=$(printf '%s' "$body" | sed -E "s/<!-- gh900-state:[^>]+ -->/<!-- gh900-state:complete -->/")
            gh issue edit "$issue_number" --body "$new_body"
            gh issue close "$issue_number" --reason completed
            exit 0
          fi

          next_state=$(jq -r .id <<<"$next_meta")
          new_body=$(printf '%s' "$body" | sed -E "s/<!-- gh900-state:[^>]+ -->/<!-- gh900-state:${next_state} -->/")
          gh issue edit "$issue_number" --body "$new_body"
          python3 scripts/course_unit_state.py --unit "$next_state" --render > /tmp/next.md
          gh issue comment "$issue_number" --body-file /tmp/next.md
