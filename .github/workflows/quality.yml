name: Course Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.repository.is_template
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out course repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned Microsoft Learn source snapshot
        shell: bash
        env:
          MICROSOFT_LEARN_COMMIT: 66ab07a355b38fb0f5a4cef8240eb2f765c839c8
        run: |
          set -euo pipefail
          mkdir _microsoft_learn
          git -C _microsoft_learn init --quiet
          git -C _microsoft_learn remote add origin https://github.com/MicrosoftDocs/learn.git
          git -C _microsoft_learn sparse-checkout init --cone
          git -C _microsoft_learn sparse-checkout set \
            learn-pr/student-evangelism/intro-to-git \
            learn-pr/github/introduction-to-github \
            learn-pr/github/github-introduction-products \
            learn-pr/github/configure-code-scanning \
            learn-pr/github/introduction-to-github-copilot \
            learn-pr/github/code-with-github-codespaces \
            learn-pr/github/manage-work-github-projects \
            learn-pr/github/communicate-using-markdown \
            learn-pr/github/contribute-open-source \
            learn-pr/github/manage-innersource-program-github \
            learn-pr/github/maintain-secure-repository-github \
            learn-pr/github/github-introduction-administration \
            learn-pr/github/authenticate-authorize-user-identities-github \
            learn-pr/github/manage-changes-pull-requests-github \
            learn-pr/github/search-organize-repository-history-github \
            learn-pr/github/introduction-copilot-python
          git -C _microsoft_learn -c protocol.version=2 fetch \
            --no-tags --depth=1 --filter=blob:none origin "$MICROSOFT_LEARN_COMMIT"
          git -C _microsoft_learn -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
          actual=$(git -C _microsoft_learn rev-parse HEAD)
          [[ "$actual" == "$MICROSOFT_LEARN_COMMIT" ]] || {
            echo "Expected Microsoft Learn $MICROSOFT_LEARN_COMMIT, got $actual"
            exit 1
          }

      - name: Audit public repository and complete 106-unit runtime
        run: python3 .gh900/quality/audit.py

      - name: Audit on-demand workspace fixture contracts
        run: python3 .gh900/quality/fixture_contracts.py

      - name: Audit source depth against pinned Microsoft Learn
        run: python3 .gh900/quality/semantic.py

      - name: Audit required concepts in all 106 learner-visible units
        run: python3 .gh900/quality/concept_coverage.py

      - name: Audit January 2026 GH-900 exam objectives
        run: python3 .gh900/quality/exam_coverage.py

      - name: Simulate all 106 runtime states and protocol contracts
        run: python3 .gh900/quality/simulate_runtime.py

      - name: Compile runtime and quality helpers
        run: >-
          python3 -m py_compile
          .gh900/course_unit_state.py
          .gh900/runtime_protocol.py
          .gh900/workspace.py
          .gh900/validate_activity.py
          .gh900/validate_activity_core.py
          .gh900/validate_assessment.py
          .gh900/validate_checkpoint.py
          .gh900/validate_scenario.py
          .gh900/quality/audit.py
          .gh900/quality/fixture_contracts.py
          .gh900/quality/semantic.py
          .gh900/quality/concept_coverage.py
          .gh900/quality/exam_coverage.py
          .gh900/quality/simulate_runtime.py

      - name: Parse workflow YAML
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/workflows/*.{yml,yaml}"].each do |file|
            YAML.parse_file(file)
            puts "parsed #{file}"
          end
          RUBY

      - name: Check Bash syntax in workflow run blocks
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "tempfile"

          failures = []
          Dir[".github/workflows/*.{yml,yaml}"].each do |file|
            data = YAML.safe_load_file(file, aliases: true)
            (data["jobs"] || {}).each do |job_name, job|
              (job["steps"] || []).each_with_index do |step, index|
                script = step["run"]
                next unless script
                shell = step["shell"].to_s
                next unless shell.empty? || shell.include?("bash")

                Tempfile.create(["workflow-run", ".sh"]) do |tmp|
                  tmp.write(script)
                  tmp.flush
                  ok = system("bash", "-n", tmp.path, out: File::NULL, err: File::NULL)
                  failures << "#{file}: job #{job_name}, step #{index + 1}" unless ok
                end
              end
            end
          end

          unless failures.empty?
            warn "Bash syntax failures:"
            failures.each { |item| warn "- #{item}" }
            exit 1
          end
          puts "All Bash/default-shell workflow run blocks parse successfully."
          RUBY

      - name: Confirm malformed assessments are rejected
        shell: bash
        run: |
          set -euo pipefail
          for module in $(seq 1 16); do
            set +e
            python3 .gh900/validate_assessment.py --module "$module" --answers "A" >/tmp/assessment.txt 2>&1
            result=$?
            set -e
            if [[ "$result" -eq 0 ]]; then
              echo "Malformed Module $module assessment unexpectedly passed."
              cat /tmp/assessment.txt
              exit 1
            fi
          done
          echo "All malformed assessments are rejected."

      - name: Confirm unstructured or shallow scenarios are rejected
        shell: bash
        run: |
          set -euo pipefail
          for unit in m03-u07 m07-u06 m12-u05 m13-u05; do
            set +e
            python3 .gh900/validate_scenario.py --unit "$unit" --response "authentication authorization policy team usage cost usage cost usage cost" >/tmp/scenario.txt 2>&1
            result=$?
            set -e
            if [[ "$result" -eq 0 ]]; then
              echo "Unstructured scenario $unit unexpectedly passed."
              cat /tmp/scenario.txt
              exit 1
            fi
          done
          echo "All unstructured/shallow scenario responses are rejected."

      - name: Confirm incomplete account-aware checkpoint is rejected
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 .gh900/validate_checkpoint.py --unit m16-u03 --response "access=unavailable" >/tmp/checkpoint.txt 2>&1
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            echo "Incomplete M16-U03 checkpoint unexpectedly passed."
            cat /tmp/checkpoint.txt
            exit 1
          fi
          echo "Incomplete account-aware checkpoint is rejected."

      - name: Confirm unprepared hands-on states are rejected
        shell: bash
        run: |
          set -euo pipefail
          python3 .gh900/course_unit_state.py --list-json \
            | jq -r '.[] | select(.mode == "activity") | .id' \
            | while read -r unit; do
                set +e
                python3 .gh900/validate_activity.py --unit "$unit" >/tmp/activity.txt 2>&1
                result=$?
                set -e
                if [[ "$result" -eq 0 ]]; then
                  echo "Unprepared activity $unit unexpectedly passed."
                  cat /tmp/activity.txt
                  exit 1
                fi
              done
          echo "All unprepared hands-on states are rejected."
