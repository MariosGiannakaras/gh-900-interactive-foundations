name: GH-900 Module 1 Interactive Course

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lab/module-01-git

permissions:
  contents: read
  issues: write

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate course state and post the next step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_TITLE: "GH-900 Interactive Course - Module 1: Introduction to Git"
        run: |
          set -euo pipefail

          row=$(gh issue list --state all --limit 100 --json number,title,state \
            | jq -r --arg title "$COURSE_TITLE" \
              '.[] | select(.title == $title) | [.number, .state] | @tsv' \
            | head -n 1)

          created=false
          if [[ -z "$row" ]]; then
            url=$(gh issue create \
              --title "$COURSE_TITLE" \
              --body "This issue is the interactive guide for Module 1. It maps all 6 Microsoft Learn units plus the official linked GitHub Skills exercise. Follow only the latest course step posted by the workflow.")
            issue_number="${url##*/}"
            issue_state="OPEN"
            created=true
          else
            issue_number=$(printf '%s' "$row" | cut -f1)
            issue_state=$(printf '%s' "$row" | cut -f2)
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ "$created" == "true" ]]; then
              gh issue comment "$issue_number" --body-file course-content/module-01/step-1.md
            fi
            exit 0
          fi

          if [[ "$GITHUB_REF" != "refs/heads/lab/module-01-git" ]]; then
            exit 0
          fi

          if [[ "$issue_state" == "CLOSED" ]]; then
            exit 0
          fi

          git fetch origin main:refs/remotes/origin/main
          commits=$(git rev-list --count origin/main..HEAD)
          merge_commits=$(git rev-list --merges origin/main..HEAD | wc -l | tr -d ' ')

          if git diff --quiet origin/main...HEAD -- labs/module-01/version-control-notes.md; then
            gh issue comment "$issue_number" --body-file course-content/module-01/step-2.md
            exit 0
          fi

          if grep -q 'TODO:' labs/module-01/version-control-notes.md || (( commits < 2 )); then
            gh issue comment "$issue_number" --body $'### Checkpoint not passed\n\nThe notes exercise is not complete yet. Remove every `TODO:` from `labs/module-01/version-control-notes.md` and make sure the lab branch contains at least two commits beyond `main`: one CLI commit and one VS Code Source Control commit. Then push again.'
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- labs/module-01/diff-practice.txt; then
            gh issue comment "$issue_number" --body-file course-content/module-01/step-3.md
            exit 0
          fi

          if grep -q 'Temporary status line' labs/module-01/diff-practice.txt; then
            gh issue comment "$issue_number" --body $'### Checkpoint not passed\n\nThe diff fixture still contains the temporary line that Step 3 asks you to remove. Complete the requested edits, commit, and push again.'
            exit 0
          fi

          if (( merge_commits < 1 )); then
            gh issue comment "$issue_number" --body-file course-content/module-01/step-4.md
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- labs/module-01/vscode-branch.txt; then
            gh issue comment "$issue_number" --body-file course-content/module-01/step-5.md
            exit 0
          fi

          if grep -q 'TODO:' labs/module-01/vscode-branch.txt; then
            gh issue comment "$issue_number" --body $'### Checkpoint not passed\n\nThe VS Code branch exercise file still contains a `TODO:` marker. Finish Step 5 using the Source Control UI, merge the temporary branch into `lab/module-01-git`, and push again.'
            exit 0
          fi

          if git diff --quiet origin/main...HEAD -- labs/module-01/assessment.md; then
            gh issue comment "$issue_number" --body-file course-content/module-01/step-6.md
            exit 0
          fi

          set +e
          output=$(python3 scripts/validate_module_01.py 2>&1)
          result=$?
          set -e

          if (( result == 0 )); then
            gh issue comment "$issue_number" --body $'## Module 1 complete — Introduction to Git\n\nAssessment passed. You have completed all 6 Microsoft Learn units and the concepts/activities in the official linked GitHub Skills Introduction to Git exercise.\n\nRead the Unit 6 summary in `modules/01-introduction-to-git/README.md` once more before Module 2.'
            gh issue close "$issue_number" --reason completed
          else
            printf '%s\n' "$output" > /tmp/module01-result.txt
            {
              printf '%s\n\n' '### Assessment needs another attempt'
              printf '%s\n' '```text'
              cat /tmp/module01-result.txt
              printf '%s\n\n' '```'
              printf '%s\n' 'Review only the indicated questions in the Module 1 theory, change your selected checkboxes, commit, and push again. The answer key remains hidden.'
            } > /tmp/module01-comment.md
            gh issue comment "$issue_number" --body-file /tmp/module01-comment.md
          fi
