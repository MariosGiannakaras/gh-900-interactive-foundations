name: Step 0 - Start GH-900 Course

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  start:
    if: |
      !github.event.repository.is_template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out learner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create course Issue if needed
        id: course
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_TITLE: "GH-900 Interactive Foundations — Course"
        run: |
          set -euo pipefail
          existing=$(gh issue list --state all --limit 100 --json number,title \
            | jq -r --arg title "$COURSE_TITLE" '.[] | select(.title == $title) | .number' \
            | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > /tmp/body.md <<'EOF'
          <!-- gh900-state:m01-u01 -->
          # GH-900 Interactive Foundations

          This Issue is the course interface. Lessons, assessments, feedback, and progress appear here.

          - Follow only the latest course instruction.
          - Do not edit the hidden `gh900-state` marker.
          - Exercise files appear only when the current unit needs them.
          - Temporary exercise branches/files are cleaned after validation.
          - `/help` shows the current unit again.
          EOF

          url=$(gh issue create --title "$COURSE_TITLE" --body-file /tmp/body.md)
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Ensure template copy is a clean learner workspace
        shell: bash
        run: |
          set -euo pipefail
          # Recovery is intentionally idempotent. If Issue creation succeeded in an
          # earlier attempt but source-only template files remain, finish bootstrap.
          needs_bootstrap=false
          for path in \
            .github/CONTRIBUTING.md \
            .github/CODE_OF_CONDUCT.md \
            .github/SECURITY.md \
            .github/ARCHITECTURE.md \
            .github/MAINTAINING.md \
            .github/workflows/quality.yml; do
            if [[ -e "$path" ]]; then
              needs_bootstrap=true
              break
            fi
          done

          if [[ "$needs_bootstrap" == "false" ]]; then
            echo "Learner workspace already initialized."
            exit 0
          fi

          python3 .gh900/workspace.py bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Learner workspace already clean."
          else
            git commit -m "Initialize GH-900 learner workspace"
            git push origin HEAD:main
          fi

      - name: Ensure first unit is posted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.course.outputs.number }}
        run: |
          set -euo pipefail
          # A previous attempt may have created the Issue but failed before posting the
          # first lesson. Detect any rendered course unit by its stable progress table.
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --jq '.[].body' | grep -Fq '| Course position | Progress |'; then
            echo "Course unit already present; startup is complete."
            exit 0
          fi
          python3 .gh900/course_unit_state.py --first --render > /tmp/unit.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/unit.md
