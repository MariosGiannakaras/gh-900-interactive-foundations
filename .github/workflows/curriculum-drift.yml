name: Curriculum Drift

on:
  schedule:
    # Once per month. GitHub schedules use UTC.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Microsoft Learn baseline
    if: github.repository == 'MariosGiannakaras/gh-900-interactive-foundations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f54420f54e4 # v6.0.2

      - name: Check official module paths for changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          lock = json.loads(Path('.gh900/data/microsoft-source-lock.json').read_text())
          upstream = lock['repository']
          baseline = lock['commit']

          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'gh-900-curriculum-drift-check',
          }
          token = os.environ.get('GH_TOKEN')
          if token:
              headers['Authorization'] = f'Bearer {token}'

          def api(path, params=None):
              url = f'https://api.github.com/repos/{upstream}/{path}'
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          baseline_commit = api(f'commits/{baseline}')
          baseline_time = baseline_commit['commit']['committer']['date']
          changed = []

          for module, spec in sorted(lock['modules'].items()):
              commits = api('commits', {
                  'path': spec['root'],
                  'since': baseline_time,
                  'per_page': 10,
              })
              newer = [c for c in commits if c['sha'] != baseline]
              if newer:
                  changed.append((module, spec['root'], newer[0]['sha']))

          checked = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if changed:
              lines = [
                  '# Microsoft Learn curriculum drift detected',
                  '',
                  f'Baseline: `{upstream}@{baseline}`',
                  f'Checked: {checked}',
                  '',
                  'The following locked module paths have upstream commits newer than the verified baseline:',
                  '',
              ]
              lines.extend(f'- Module {m}: `{path}` (latest observed `{sha[:12]}`)' for m, path, sha in changed)
              lines.extend([
                  '',
                  'Review the upstream changes before updating the source lock, course content, concept coverage, or GH-900 mappings.',
              ])
              summary.write_text('\n'.join(lines) + '\n')
              print(f'Curriculum drift detected in {len(changed)} module path(s).', file=sys.stderr)
              sys.exit(1)

          summary.write_text(
              '# Microsoft Learn curriculum baseline is current\n\n'
              f'No commits newer than `{baseline[:12]}` were found in the 16 locked module paths.\n\n'
              f'Checked: {checked}\n'
          )
          print('No Microsoft Learn curriculum drift detected.')
          PY